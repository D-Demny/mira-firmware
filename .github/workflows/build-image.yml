name: Image build

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [upstream-push]
  workflow_dispatch:
    inputs:
      daemon_ref:
        description: mira-daemon ref to build
        default: main
      ui_ref:
        description: mira-ui ref to build
        default: main
      firmware_ref:
        description: mira-firmware ref to build
        default: main
      bundle_voice:
        description: bundle voice artifacts (1/0)
        default: "1"

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUNDLE_VOICE: ${{ github.event.inputs.bundle_voice || '1' }}
    steps:
      - name: log trigger
        if: github.event_name == 'repository_dispatch'
        run: echo "triggered by ${{ github.event.client_payload.repo }}@${{ github.event.client_payload.sha }}"

      - name: checkout firmware repo
        uses: actions/checkout@v7
        with:
          repository: D-Demny/mira-firmware
          ref: ${{ github.event.inputs.firmware_ref || 'main' }}
          path: mira-firmware

      - name: checkout daemon repo
        uses: actions/checkout@v7
        with:
          repository: D-Demny/mira-daemon
          ref: ${{ github.event.inputs.daemon_ref || 'main' }}
          path: mira-daemon

      - name: checkout ui repo
        uses: actions/checkout@v7
        with:
          repository: D-Demny/mira-ui
          ref: ${{ github.event.inputs.ui_ref || 'main' }}
          path: mira-ui

      - name: checkout voice repo (optional)
        run: |
          if curl -sfL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/D-Demny/mira-voice" >/dev/null 2>&1; then
            echo "mira-voice repo exists, checking out..."
            git clone --depth 1 https://github.com/D-Demny/mira-voice.git mira-voice || echo "clone failed, continuing without voice"
          else
            echo "mira-voice repo not found, skipping voice artifacts"
            rm -rf mira-voice
          fi

      - name: detect voice artifacts availability
        id: voice_check
        run: |
          if [ -d "mira-voice" ] && [ -f "mira-voice/collect-artifacts.sh" ]; then
            echo "voice_available=true" >> "$GITHUB_OUTPUT"
            echo "Voice repo available"
          else
            echo "voice_available=false" >> "$GITHUB_OUTPUT"
            echo "Voice repo not available, will skip voice artifacts"
          fi

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: mira-daemon/go.mod
          cache-dependency-path: mira-daemon/go.sum

      - name: build daemon (armv6)
        working-directory: mira-daemon
        run: |
          ./crosscompile.sh armv6
          cp go-librespot-armv6 ../mira-firmware/
          cp config.yml ../mira-firmware/go-librespot-config.yml

      - name: build iap2 sidecar (armv7)
        working-directory: mira-daemon
        run: |
          rustup target add armv7-unknown-linux-musleabihf
          ./iap2/build.sh
          cp iap2/iap2-sidecar-armv7 ../mira-firmware/

      - name: inject report submit key
        working-directory: mira-firmware
        env:
          KEY: ${{ secrets.REPORT_SUBMIT_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            sed -i "s|mira-reports.mira-thing.workers.dev/\"|mira-reports.mira-thing.workers.dev/?k=$KEY\"|" go-librespot-config.yml
            echo "report key injected"
          else
            echo "no REPORT_SUBMIT_KEY secret - keyless build"
          fi

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mira-ui/package-lock.json

      - name: build ui
        working-directory: mira-ui
        run: |
          npm ci
          npm run build
          cd dist && zip -r9 ../../mira-firmware/ui.zip .

      - name: lyrics provider env (empty - lrclib fallback)
        working-directory: mira-firmware
        run: ': > lp.env'

      - name: fetch voice artifacts
        if: env.BUNDLE_VOICE != '0' && steps.voice_check.outputs.voice_available == 'true'
        working-directory: mira-firmware
        run: |
          mkdir -p voice-artifacts
          VOICE_REPO=../mira-voice bash ./scripts/get-voice-artifacts.sh ./voice-artifacts

      - name: ensure voice-artifacts dir exists (docker COPY requires it)
        working-directory: mira-firmware
        run: mkdir -p voice-artifacts

      - name: register qemu binfmt
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: docker build
        working-directory: mira-firmware
        run: docker build -t firmware-builder .

      - name: build image
        working-directory: mira-firmware
        run: |
          BV="${{ env.BUNDLE_VOICE }}"
          if [ "${{ steps.voice_check.outputs.voice_available }}" != "true" ]; then
            BV="0"
          fi
          docker run --rm --privileged -e BUNDLE_VOICE="$BV" -v "$PWD/output:/work/output" firmware-builder

      - name: checksum
        working-directory: mira-firmware
        run: sha256sum output/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mira-firmware-image
          path: mira-firmware/output/*.zip
          retention-days: 14
          if-no-files-found: error
